##
## Configuration strfry de PRODUCTION (VM Oracle, dérivée de
## strfry.conf.example — voir ce fichier pour le commentaire de chaque choix).
##
## Le relais n'écoute que la boucle locale : c'est Caddy qui expose
## `wss://<hôte>/relay` et fait le TLS. La base vit hors du dépôt
## (`~/forome-data/`) pour qu'un redéploiement ne puisse jamais la toucher.
##

db = "/home/ubuntu/forome-data/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

relay {
    bind = "127.0.0.1"
    port = 7777

    nofiles = 65536

    info {
        name = "Forome"
        description = "Relais du forum. Kinds 11/1111 marqués t=forome avec preuve de travail, profils et listes."
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxReqFilterSize = 200
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/home/ubuntu/forome/packages/relay-policy/run-strfry.sh"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
    }

    numThreads {
        ingester = 1
        writer = 1
        reqWorker = 2
        reqMonitor = 1
        negentropy = 1
    }
}
