##
## Configuration strfry de développement pour Forome (spec v2 §12.2, §13).
##
## Celle-ci est **exécutée**, pas illustrative : `npm run dev:strfry` la passe à
## un vrai strfry compilé. `strfry.conf.example` reste le modèle commenté pour un
## déploiement ; ici les chemins sont relatifs au dépôt et le relais n'écoute que
## sur la boucle locale.
##
## Le port 7778 et non 7447 : `dev-relay.ts` (le relais Node en mémoire) garde le
## sien, et les faire cohabiter permet de comparer les deux sur la même machine —
## c'est ce qui a montré que la policy se comporte pareil des deux côtés.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

relay {
    bind = "127.0.0.1"
    port = 7778

    nofiles = 0

    info {
        name = "Forome (dev)"
        description = "Relais de développement du forum. Kinds 11/1111 marqués t=forome, avec preuve de travail."
        pubkey = ""
        contact = ""
    }

    auth {
        # NIP-42, et c'est la lecture des MP qui en dépend.
        #
        # strfry exige une AUTH pour tout filtre ne portant que des kinds de
        # `auth.restrictedReadKinds` — « 4, 1059 » PAR DÉFAUT, donc actif même
        # sans ce bloc. On le veut : sans lui, n'importe qui moissonne les
        # emballages de n'importe qui et sait qui reçoit des MP et quand, ce que
        # le gift wrap est précisément censé cacher au relais.
        #
        # Mais `serviceUrl` vide, strfry réclame une AUTH qu'il ne peut pas
        # valider (« relay needs serviceUrl to be configured before AUTH can
        # work ») et n'annonce même pas le NIP 42 en NIP-11. Les MP étaient
        # acceptés à l'écriture puis illisibles, sans rien d'exploitable côté
        # client. D'où cette ligne, qui n'est pas du confort.
        #
        # Seul `hôte:port` est comparé (le schéma et le chemin sont ignorés),
        # donc ceci vaut pour ws:// comme pour wss://.
        serviceUrl = "ws://localhost:7778"
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        # LE point d'entrée de la policy partagée avec le client.
        # Chemin absolu exigé par strfry ; `npm run dev:strfry` le réécrit à
        # partir du dépôt courant, donc ne pas le figer à la main.
        plugin = "__FOROME_ROOT__/packages/relay-policy/run-strfry.sh"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
    }

    numThreads {
        ingester = 3
        writer = 1
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }
}
