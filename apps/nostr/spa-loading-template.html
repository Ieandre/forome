<!-- Ce fichier EST servi à chaque visite : le garder maigre. Le pourquoi est dans
     `nuxt.config.ts`, à `spaLoadingTemplate`. -->
<div class="boot" role="status" aria-label="Chargement de Forome">
  <div class="boot__bar">
    <span class="boot__brand">Forome<i>.</i></span>
  </div>
  <div class="boot__main">
    <div class="boot__panel boot__panel--list">
      <span class="boot__row" style="--w: 78%"></span>
      <span class="boot__row" style="--w: 62%"></span>
      <span class="boot__row" style="--w: 71%"></span>
      <span class="boot__row" style="--w: 55%"></span>
      <span class="boot__row" style="--w: 66%"></span>
      <span class="boot__row" style="--w: 48%"></span>
    </div>
    <div class="boot__panel boot__panel--topic"></div>
  </div>
</div>

<style>
  .boot {
    --boot-page: #e9ecf2;
    --boot-surface: #ffffff;
    --boot-line: #edf0f5;
    --boot-ink: #0d1117;
    --boot-brand: #ff5c00;
    --boot-skel-a: #f2f4f8;
    --boot-skel-b: #e8ecf3;

    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--boot-page);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* Les deux blocs sont dupliqués parce qu'ils ne répondent pas au même signal :
     `data-theme` est un choix explicite et doit gagner dans les deux sens, y
     compris contre la préférence système. Voir `main.css`, même construction. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .boot {
      --boot-page: #0b0e13;
      --boot-surface: #141922;
      --boot-line: #1d242e;
      --boot-ink: #e9edf4;
      --boot-brand: #ff6b21;
      --boot-skel-a: #1a202a;
      --boot-skel-b: #222936;
    }
  }
  :root[data-theme='dark'] .boot {
    --boot-page: #0b0e13;
    --boot-surface: #141922;
    --boot-line: #1d242e;
    --boot-ink: #e9edf4;
    --boot-brand: #ff6b21;
    --boot-skel-a: #1a202a;
    --boot-skel-b: #222936;
  }

  .boot__bar {
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  /* Bricolage n'est pas encore chargée : la police système tient la place sans
     prétendre être le wordmark final. Le point orange, lui, est le signe. */
  .boot__brand {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.045em;
    color: var(--boot-ink);
  }
  .boot__brand i {
    font-style: normal;
    color: var(--boot-brand);
  }

  .boot__main {
    display: grid;
    grid-template-columns: minmax(300px, 31%) 1fr;
    gap: 10px;
    flex: 1;
    min-height: 0;
    padding: 0 10px 10px;
  }
  .boot__panel {
    background: var(--boot-surface);
    border: 1px solid var(--boot-line);
    border-radius: 16px;
    min-height: 0;
  }
  .boot__panel--list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 56px 16px 16px;
  }

  .boot__row {
    display: block;
    width: var(--w);
    height: 11px;
    border-radius: 6px;
    background: linear-gradient(
      90deg,
      var(--boot-skel-a) 25%,
      var(--boot-skel-b) 37%,
      var(--boot-skel-a) 63%
    );
    background-size: 400% 100%;
    animation: boot-skel 1.5s ease infinite;
  }
  @keyframes boot-skel {
    0% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0 50%;
    }
  }

  /* Sous 820 px la colonne de topics prend tout l'écran (voir `ForumShell`) :
     annoncer un panneau de droite ferait bouger la mise en page au montage. */
  @media (max-width: 820px) {
    .boot__main {
      grid-template-columns: 1fr;
    }
    .boot__panel--topic {
      display: none;
    }
  }
  @media (max-width: 700px) {
    .boot__main {
      padding: 0;
    }
    .boot__panel {
      border: none;
      border-radius: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot__row {
      animation: none;
    }
  }
</style>
