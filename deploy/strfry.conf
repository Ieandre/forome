##
## Configuration strfry de PRODUCTION (VM Oracle, dérivée de
## strfry.conf.example — voir ce fichier pour le commentaire de chaque choix).
##
## Le relais n'écoute que la boucle locale : c'est Caddy qui expose
## `wss://<hôte>/relay` et fait le TLS. La base vit hors du dépôt
## (`~/forome-data/`) pour qu'un redéploiement ne puisse jamais la toucher.
##
## ⚠️ Ce fichier est un GABARIT depuis l'AUTH NIP-42 : `__HOST__` y est remplacé
## par `deploy/install.sh`, qui écrit la config effective dans
## `~/forome-data/strfry.conf` — c'est celle-là que le service exécute. Ne pas
## passer ce fichier-ci à strfry : l'AUTH refuserait tout le monde en comparant
## le tag `relay` du client à l'hôte littéral « __HOST__ ».
##

db = "/home/ubuntu/forome-data/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

relay {
    bind = "127.0.0.1"
    port = 7777

    nofiles = 65536

    info {
        name = "Forome"
        description = "Relais du forum. Kinds 11/1111 marqués t=forome avec preuve de travail, profils et listes."
        pubkey = ""
        contact = ""
    }

    auth {
        # NIP-42, et c'est la lecture des MP qui en dépend.
        #
        # strfry exige une AUTH pour tout filtre ne portant que des kinds de
        # `auth.restrictedReadKinds` — « 4, 1059 » PAR DÉFAUT, donc actif même
        # sans ce bloc. On le veut : sans lui, n'importe qui moissonne les
        # emballages de n'importe qui et sait qui reçoit des MP et quand, ce que
        # le gift wrap est précisément censé cacher au relais.
        #
        # Mais `serviceUrl` vide, strfry réclame une AUTH qu'il ne peut pas
        # valider (« relay needs serviceUrl to be configured before AUTH can
        # work ») et n'annonce même pas le NIP 42 en NIP-11. Les MP étaient
        # acceptés à l'écriture puis illisibles, sans rien d'exploitable côté
        # client. D'où cette ligne, qui n'est pas du confort.
        #
        # Seul `hôte:port` est comparé : le schéma et le chemin `/relay` sont
        # ignorés des deux côtés, seul l'hôte doit correspondre à celui que le
        # navigateur a composé.
        serviceUrl = "wss://__HOST__/relay"
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxReqFilterSize = 200
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/home/ubuntu/forome/packages/relay-policy/run-strfry.sh"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
    }

    numThreads {
        ingester = 1
        writer = 1
        reqWorker = 2
        reqMonitor = 1
        negentropy = 1
    }
}
